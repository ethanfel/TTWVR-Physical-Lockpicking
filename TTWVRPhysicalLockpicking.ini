; Reloaded when a lockpicking attempt opens. Distances are metres.
[Ergonomics]
LockDistanceMeters=0.42
LockBelowEyesMeters=0.42
; Physical wrist travel for the full native cylinder turn.
FullTurnWristDegrees=40
; Free two-hand bending. Set to 0 to start with prepared pins.
RequirePinPreparation=1
; Real dropped pins leave inventory and can be picked up beside the lock.
DropPinsToWorld=1
; Use locally prepared Fallout props; missing assets use simple geometry.
UseGameProps=1
; Show the box and can; tools keep these anchors when hidden.
UseToolHolders=1
; Relative to your eyes when the workspace opens; fixed for the attempt.
PinHolderSideMeters=-0.22
DriverHolderSideMeters=0.22
PinHolderBelowEyesMeters=0.60
DriverHolderBelowEyesMeters=0.60
PinHolderForwardMeters=0.16
DriverHolderForwardMeters=0.16
; Maximum visual hand correction for tools constrained by the lock.
HandConstraintMeters=0.035
HandConstraintDegrees=20
; Pick searching follows an arc about the keyhole (old PickSweepMeters ignored).
InsertRadiusMeters=0.028
InsertionTravelMeters=0.018
WithdrawTravelMeters=0.055

; GPU-only per-eye game backdrop; sharp tools remain in front.
UseGameBackground=1
BackgroundBrightness=0.35
BackgroundBlurPixels=12

; Show prepared models matching the native lock target.
UseTargetObject=1
